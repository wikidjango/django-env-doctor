[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-env-doctor"
version = "0.1.0"
description = "Validate, load, and report on Django environment variables."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "django.wiki (Ahmad)" }]
keywords = ["django", "environment", "env", "configuration", "validation", "dotenv"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
requires-python = ">=3.10"
dependencies = []  # Zero runtime dependencies by design

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "django>=4.2",
    "ruff>=0.4",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://django.wiki"
Documentation = "https://github.com/wikidjango/django-env-doctor#readme"
Repository = "https://github.com/wikidjango/django-env-doctor"
"Bug Tracker" = "https://github.com/wikidjango/django-env-doctor/issues"
Changelog = "https://github.com/wikidjango/django-env-doctor/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["django_env_doctor*"]

[tool.pytest.ini_options]
testpaths = ["django_env_doctor/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["django_env_doctor"]
omit = ["django_env_doctor/tests/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
